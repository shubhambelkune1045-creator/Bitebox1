<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        span{color:red;}
       

    </style>
</head>

<body>
     
    
     <header>
   
     <h1><Mark>Contact Us</Mark></h1>
     <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="menu.html">Menu</a>
     </nav>
     </header>
     <main>

        <hr>

        <form action="#" method="">

            <label for="fullname">Full Name : </label>

            <input type="text" name="fullname"
            id="fullname" placeholder="Enter Full Name" required><SPan> *</SPan>

            <br><br>

            <label for="email">Email address : </label>
            <input type="email" name="email" id="email"
            placeholder="Enter Email Address" required> <SPan> *</SPan>

            <br><br>

            <label for="password">Password : </label>
            <input type="password" name="password" id="password"
            placeholder="Enter Password" required><SPan> *</SPan>

            <br><br>

            <label for="phone">Phone : </label>
            <input type="phone" name="phone" id="phone"
            placeholder="Enter Phone number" required><SPan> *</SPan>

            <br><br>

            <label for="quantity">Quantity : </label>
            <input type="number" name="quantity" id="quantity"
            placeholder="Enter quantity" required><SPan> *</SPan>

            <br><br>

            <label for="ddate">Delivery Date : </label>
            <input type="date" name="ddate" id="ddate"
            placeholder="Select Date">

            <br><br>

            <label for="Food">Select Food Item : </label>
            <select name="Food" id="Food">

                <option value=""></option>

                <option value="Veg Pizza">Veg Pizza </option>
                <option value="Cheese Burger">Cheese Burger </option>
                <option value="White Sause Pasta">White Sause Pasta</option>
                <option value="Veg Grilled Sandwich">Veg Grilled Sandwich</option>
                <option value="Chocklet Brownie">Chocklet Brownie</option>


            </select>

            <br><br>

            <h3>Payment Method </h3>

            <input type="radio" name="Payment" id="Cash">
            <label for="Cash">Cash</label>

            <input type="radio" name="Payment" id="UPI">
            <label for="UPI">UPI</label>

            <input type="radio" name="Payment" id="Card">
            <label for="Card">Card</label>

            <br><br>

            <h3>Extras : </h3>

            <input type="checkbox" name="Extras" id="Cheese">
            <label for="Cheese">Cheese </label>

            <input type="checkbox" name="Extras" id="drink">
            <label for="drink">Drink  </label>

            <input type="checkbox" name="Extras" id="Dessert">
            <label for="Dessert">Dessert </label>

            <br><br>

            <h3>Delivery Instructions </h3>

            <label for="address">Address : </label>
            <textarea name="address" id="address" rows="1" cols="40"> </textarea>

            <br><br>

            <button>Place Order </button>
            <button>Clear Form </button>

        </form>



     </main>

     <br>

     <h2>Visit Our Wrbsite</h2>
     <p><a href="http://www.google.com">Visit Google </a></p>
     <br><br>
     
    

</body>
</html>
